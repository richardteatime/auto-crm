services:
  crm:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT:-http://localhost:80/v1}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID:-crm}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Email (Resend) + notifiche lead/workflow — necessarie per send_email
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DIGEST_FROM=${DIGEST_FROM:-onboarding@resend.dev}
      - DIGEST_EMAIL=${DIGEST_EMAIL:-}
      - LEO_EMAIL=${LEO_EMAIL:-}
      - LEAD_NOTIFY_EMAIL=${LEAD_NOTIFY_EMAIL:-}
      # AI provider (OpenRouter) — opzionale
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # Optional: Anthropic
      # - ANTHROPIC_API_KEY=sk-ant-...
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
