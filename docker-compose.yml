services:
  crm:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT:-http://localhost:80/v1}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID:-crm}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Telegram bot diretto online
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-}
      - CRM_CONFIRMATION_MODE=${CRM_CONFIRMATION_MODE:-risky}
      - CRM_CONFIRMATION_TTL_MINUTES=${CRM_CONFIRMATION_TTL_MINUTES:-10}
      - TELEGRAM_AUDIO_MAX_SECONDS=${TELEGRAM_AUDIO_MAX_SECONDS:-120}
      - TELEGRAM_AUDIO_MAX_BYTES=${TELEGRAM_AUDIO_MAX_BYTES:-20971520}
      # Email (Resend) + notifiche lead/workflow — necessarie per send_email
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DIGEST_FROM=${DIGEST_FROM:-onboarding@resend.dev}
      - DIGEST_EMAIL=${DIGEST_EMAIL:-}
      - LEO_EMAIL=${LEO_EMAIL:-}
      - LEO_NAME=${LEO_NAME:-Leo}
      - LEAD_NOTIFY_EMAIL=${LEAD_NOTIFY_EMAIL:-}
      # Funnel a 2 call — setter "Cugina di Rick" + slug booking del closer
      - CUGINA_NAME=${CUGINA_NAME:-Cugina di Rick}
      - CUGINA_USER_ID=${CUGINA_USER_ID:-cugina}
      - CUGINA_EMAIL=${CUGINA_EMAIL:-}
      - LEO_BOOKING_SLUG=${LEO_BOOKING_SLUG:-call-leo}
      # AI provider (OpenRouter) — opzionale
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # OpenAI diretto — trascrizione voice/audio Telegram
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      - OPENAI_TRANSCRIPTION_LANGUAGE=${OPENAI_TRANSCRIPTION_LANGUAGE:-it}
      # Optional: Anthropic
      # - ANTHROPIC_API_KEY=sk-ant-...
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
