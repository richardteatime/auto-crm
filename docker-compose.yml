services:
  crm:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT:-http://localhost:80/v1}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID:-crm}
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Telegram bot diretto online
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      - ADMIN_TELEGRAM_IDS=${ADMIN_TELEGRAM_IDS:-}
      - CRM_CONFIRMATION_MODE=${CRM_CONFIRMATION_MODE:-risky}
      - CRM_CONFIRMATION_TTL_MINUTES=${CRM_CONFIRMATION_TTL_MINUTES:-10}
      - TELEGRAM_AUDIO_MAX_SECONDS=${TELEGRAM_AUDIO_MAX_SECONDS:-120}
      - TELEGRAM_AUDIO_MAX_BYTES=${TELEGRAM_AUDIO_MAX_BYTES:-20971520}
      # Email (Resend) + notifiche lead/workflow — necessarie per send_email
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - DIGEST_FROM=${DIGEST_FROM:-onboarding@resend.dev}
      - DIGEST_EMAIL=${DIGEST_EMAIL:-}
      - LEO_EMAIL=${LEO_EMAIL:-}
      - LEO_NAME=${LEO_NAME:-Leo}
      - LEO_USER_ID=${LEO_USER_ID:-}
      - LEAD_NOTIFY_EMAIL=${LEAD_NOTIFY_EMAIL:-}
      # Funnel a 2 call — setter "Cugina di Rick" + slug booking del closer
      - CUGINA_NAME=${CUGINA_NAME:-Cugina di Rick}
      - CUGINA_USER_ID=${CUGINA_USER_ID:-cugina}
      - CUGINA_EMAIL=${CUGINA_EMAIL:-}
      - LEO_BOOKING_SLUG=${LEO_BOOKING_SLUG:-call-leo}
      # Finance access whitelist
      - FINANCE_USER_IDS=${FINANCE_USER_IDS:-}
      # AI provider (OpenRouter) — opzionale
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      # OpenAI diretto — trascrizione voice/audio Telegram
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_TRANSCRIPTION_MODEL=${OPENAI_TRANSCRIPTION_MODEL:-gpt-4o-mini-transcribe}
      - OPENAI_TRANSCRIPTION_LANGUAGE=${OPENAI_TRANSCRIPTION_LANGUAGE:-it}
      # Chatwoot / WhatsApp / Telegram integration
      - ADMIN_WHATSAPP_NUMBERS=${ADMIN_WHATSAPP_NUMBERS:-}
      - CHATWOOT_URL=${CHATWOOT_URL:-}
      - CHATWOOT_ACCOUNT_ID=${CHATWOOT_ACCOUNT_ID:-}
      - CHATWOOT_API_ACCESS_TOKEN=${CHATWOOT_API_ACCESS_TOKEN:-}
      - CHATWOOT_WEBHOOK_SECRET=${CHATWOOT_WEBHOOK_SECRET:-}
      # Public URL used for callbacks (GitAgent / deploy)
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Feature flags — Orchestrator
      - ENABLE_INTERNAL_COMMANDS=${ENABLE_INTERNAL_COMMANDS:-true}
      - ENABLE_GITAGENT_DISPATCH=${ENABLE_GITAGENT_DISPATCH:-true}
      - ENABLE_AUTODEPLOY_PREVIEW=${ENABLE_AUTODEPLOY_PREVIEW:-true}
      - ENABLE_CUSTOMER_AUTOMATION=${ENABLE_CUSTOMER_AUTOMATION:-false}
      - CUSTOMER_AUTOMATION_UNLOCKED=${CUSTOMER_AUTOMATION_UNLOCKED:-false}
      # GitAgent — Mock server locale
      - GITAGENT_ENDPOINT=${GITAGENT_ENDPOINT:-http://localhost:4000/api/dispatch}
      - GITAGENT_API_KEY=${GITAGENT_API_KEY:-}
      - GITAGENT_CALLBACK_SECRET=${GITAGENT_CALLBACK_SECRET:-}
      # Deploy — Mock
      - DEPLOY_CALLBACK_SECRET=${DEPLOY_CALLBACK_SECRET:-}
      # Workflow secrets (mandatory — endpoints reject requests if missing)
      - WORKFLOW_TRIGGER_SECRET=${WORKFLOW_TRIGGER_SECRET:-}
      - WORKFLOW_WORKER_SECRET=${WORKFLOW_WORKER_SECRET:-}
      # Redis — opzionale (rate limiter distribuito)
      - REDIS_URL=${REDIS_URL:-}
      # CORS — Origini consentite per le API pubbliche (/api/public/*)
      - PUBLIC_API_ORIGINS=${PUBLIC_API_ORIGINS:-}
      # Optional: Anthropic
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Hermes Agent service (HTTP mode)
      - HERMES_SERVICE_URL=${HERMES_SERVICE_URL:-}
      - HERMES_API_KEY=${HERMES_API_KEY:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  hermes:
    build:
      context: ./hermes-service
    # No public ports — reachable only from the CRM container on the internal network.
    environment:
      - HERMES_HOME=/opt/hermes/home
      - HERMES_API_KEY=${HERMES_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - NEXT_PUBLIC_APPWRITE_ENDPOINT=${NEXT_PUBLIC_APPWRITE_ENDPOINT:-http://localhost:80/v1}
      - APPWRITE_PROJECT_ID=${APPWRITE_PROJECT_ID:-}
      - APPWRITE_API_KEY=${APPWRITE_API_KEY:-}
      - APPWRITE_DATABASE_ID=${APPWRITE_DATABASE_ID:-crm}
    volumes:
      - hermes-data:/opt/hermes/home
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9120/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  hermes-data:
